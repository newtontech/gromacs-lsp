# GROMACS-LSP diagnostic rule manifest (Diagnostic Engine v1).
#
# OpenQC consumers read this manifest to discover the rule surface that
# gromacs-lsp exports. Each entry carries a stable rule_id, the planned
# severity, the source classification, and a manual reference.
schema: OpenQCDiagnosticsManifest
version: 1
software: gromacs
source_provenance:
  - kind: official_spec
    label: GROMACS MDP options
    url: https://manual.gromacs.org/current/user-guide/mdp-options.html
rules:
  - rule_id: gromacs.mdp.unknown_parameter
    code: GMX002
    severity: error
    category: schema
    file_type: mdp
    source: official
    confidence: 0.9
    blocking: true
    description: >-
      Reports an MDP parameter that is not part of the official GROMACS mdp
      option set. GROMACS silently ignores unknown mdp options, which can mask
      typos (e.g. `nsteps` vs `nstesp`) and hide intended simulation behavior.
    manual_ref: https://manual.gromacs.org/current/user-guide/mdp-options.html
    fix_hint:
      kind: check_mdp_keyword
  - rule_id: gromacs.mdp.invalid_value
    code: GMX004
    severity: error
    category: type/value
    file_type: mdp
    source: official
    confidence: 0.9
    blocking: true
    description: >-
      Reports a value that is not valid for a known MDP parameter. GROMACS
      validates mdp option values at runtime (enum membership, numeric range,
      and integer type) and aborts on an out-of-set value, so an invalid value
      such as `integrator = warp9` or `nsteps = -5` will block the run before it
      starts. Catching it in the editor surfaces the failure early.
    manual_ref: https://manual.gromacs.org/current/user-guide/mdp-options.html
    fix_hint:
      kind: valid_values
  - rule_id: gromacs.topology.missing_include
    code: GMX023
    severity: error
    category: cross-file reference
    file_type: top
    source: official
    confidence: 0.9
    blocking: true
    description: >-
      Reports a GROMACS topology `#include` directive that references a file
      which cannot be resolved relative to the topology's directory (or the
      configured shared force-field paths). grompp resolves `#include`
      statements at preprocessing time and aborts when a referenced file is
      missing, so surfacing the unresolved include in the editor catches the
      failure early.
    manual_ref: https://manual.gromacs.org/current/reference-manual/topologies/file-format.html
    fix_hint:
      kind: check_include_path
  - rule_id: gromacs.topology.molecule_count_mismatch
    code: GMX024
    severity: error
    category: type/value
    file_type: top
    source: official
    confidence: 0.9
    blocking: true
    description: >-
      Reports a GROMACS `[ molecules ]` entry whose molecule type is not
      defined by any `[ moleculetype ]` block in the topology (or its
      locally-resolved includes). grompp cross-references the molecule names
      listed under `[ molecules ]` against the defined molecule types and aborts
      when a referenced type has no definition, because the declared molecule
      count cannot be satisfied. Catching the undefined reference in the editor
      surfaces the failure before runtime.
    manual_ref: https://manual.gromacs.org/current/reference-manual/topologies/file-format.html
    fix_hint:
      kind: check_molecule_type
  - rule_id: gromacs.log.fatal_error
    code: GMX401
    severity: error
    category: preflight/runtime-risk
    file_type: log
    source: official
    confidence: 0.95
    blocking: true
    description: >-
      Reports a GROMACS fatal error line in a runtime log file. GROMACS emits
      "Fatal error:" when an unrecoverable condition is detected (missing file,
      invalid input, constraint failure, etc.) and aborts the run. Surfacing
      these in the editor catches runtime failures early.
    manual_ref: https://manual.gromacs.org/current/user-guide/run-time-errors.html
    fix_hint:
      kind: review_log
  - rule_id: gromacs.log.lincs_instability
    code: GMX402
    severity: error
    category: preflight/runtime-risk
    file_type: log
    source: official
    confidence: 0.95
    blocking: true
    description: >-
      Reports a LINCS warning in a runtime log file. GROMACS emits LINCS
      warnings when constraint deviations exceed safe thresholds, indicating
      numerical instability. The simulation may have blown up or produced
      unreliable results. Common fixes: reduce the time step, use a more
      stable integrator, or review constraint settings.
    manual_ref: https://manual.gromacs.org/current/user-guide/run-time-errors.html
    fix_hint:
      kind: check_lincs
  - rule_id: gromacs.log.settle_shake_failure
    code: GMX403
    severity: error
    category: preflight/runtime-risk
    file_type: log
    source: official
    confidence: 0.95
    blocking: true
    description: >-
      Reports a SETTLE or SHAKE constraint failure in a runtime log file.
      GROMACS emits these errors when the SETTLE or SHAKE constraint solver
      cannot converge, usually due to a too-large time step, high temperature,
      or incorrect constraint topology. The simulation will abort.
    manual_ref: https://manual.gromacs.org/current/user-guide/run-time-errors.html
    fix_hint:
      kind: check_shake
  - rule_id: gromacs.cutoff.pme_warning
    code: GMX010
    severity: warning
    category: preflight/runtime-risk
    file_type: mdp
    source: official
    confidence: 0.8
    blocking: false
    description: >-
      Warns when PME-family electrostatics are combined with a suspicious
      real-space Coulomb cutoff. GROMACS splits the Coulomb interaction into a
      short-range real-space part (cut off at `rcoulomb`) and a long-range
      reciprocal part handled by PME; pushing the real-space cutoff below the
      recommended ~1.0 nm window (or disagreeing with the Van der Waals cutoff
      `rvdw`) skews the real/reciprocal split, slows the PME grid, and degrades
      energy/force accuracy. The run still starts, so this is surfaced as a
      warning rather than a blocking error.
    manual_ref: https://manual.gromacs.org/current/user-guide/mdp-options.html
    fix_hint:
      kind: align_cutoffs
